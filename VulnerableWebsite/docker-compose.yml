version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maodun-postgres
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./vulnerable-app/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./vulnerable-app/backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./vulnerable-app/backend/src/db/extensions.sql:/docker-entrypoint-initdb.d/03_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./vulnerable-app/backend
    container_name: maodun-backend
    environment:
      DATABASE_URL: postgresql://erp_user:erp_pass@postgres:5432/erp_db
      JWT_SECRET: maodun-workshop-secret-2026
      PORT: 3001
      NODE_ENV: development
    volumes:
      - ./vulnerable-app/backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./vulnerable-app/frontend
    container_name: maodun-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: maodun-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
